<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Construtor de ITr · COTEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   CONFIGURAÇÃO DO PROFESSOR
   Cole a URL do Apps Script (termina em /exec) na constante
   API_URL, lá no início do <script>, perto do fim do arquivo.
   ========================================================= */
:root{
  --paper:#f6f4ee; --card:#ffffff; --ink:#1d2433; --ink-2:#4a5368; --ink-3:#7a8296;
  --line:#d9d5ca; --line-2:#ebe8df;
  --navy:#1f3a5f; --navy-2:#2c5282; --navy-soft:#e7eef7;
  --accent:#d9611e; --accent-soft:#fbeadf;
  --ok:#2f7d4f; --ok-soft:#e3f2e8;
  --warn:#a86a00; --warn-soft:#fff4d6;
  --err:#b42318; --err-soft:#fde7e5;
  --info:#2c5282; --info-soft:#e7eef7;
  --r:10px; --shadow:0 1px 2px rgba(20,30,50,.06),0 2px 8px rgba(20,30,50,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;line-height:1.55}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h2{font-size:1.45rem}
h3{font-size:1.1rem}
p{margin:0 0 .8em}
a{color:var(--navy-2)}
button{font:inherit;cursor:pointer}
textarea,input,select{font:inherit;color:inherit}

/* ---------- topo ---------- */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-badge{background:var(--accent);color:#fff;font-family:'IBM Plex Mono',monospace;font-weight:600;padding:4px 8px;border-radius:6px;font-size:.85rem;letter-spacing:.04em}
.brand-t{font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-s{font-size:.78rem;opacity:.75}
.top .code{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:.8rem;opacity:.85}
.steps{max-width:1240px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.st{flex:1 0 auto;min-width:92px;border:0;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);border-radius:8px;padding:6px 10px;text-align:left;font-size:.78rem;line-height:1.2}
.st b{display:block;font-family:'IBM Plex Mono',monospace;font-size:.7rem;opacity:.8}
.st.done{color:#fff;background:rgba(255,255,255,.14)}
.st.done b::after{content:" ✓"}
.st.cur{background:#fff;color:var(--navy)}
.st:disabled{cursor:not-allowed;opacity:.55}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:22px 16px 120px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.wrap.single{grid-template-columns:minmax(0,1fr)}
.main{min-width:0}
.side{position:sticky;top:120px;max-height:calc(100vh - 140px);overflow:auto;display:flex;flex-direction:column;gap:14px}
@media (max-width:960px){.wrap{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.card.tight{padding:14px 16px}
.kicker{font-family:'IBM Plex Mono',monospace;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.lead{font-size:1.05rem;color:var(--ink-2)}
.muted{color:var(--ink-3);font-size:.9rem}
.pill{display:inline-block;white-space:nowrap;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--navy-soft);color:var(--navy);font-weight:600}

.callout{border-left:4px solid var(--navy-2);background:var(--navy-soft);padding:12px 14px;border-radius:0 8px 8px 0;margin:12px 0}
.callout.orange{border-color:var(--accent);background:var(--accent-soft)}
.callout.green{border-color:var(--ok);background:var(--ok-soft)}
.callout p:last-child{margin-bottom:0}

.rules{counter-reset:r;list-style:none;padding:0;margin:10px 0}
.rules li{counter-increment:r;position:relative;padding:8px 0 8px 42px;border-bottom:1px dashed var(--line)}
.rules li:last-child{border-bottom:0}
.rules li::before{content:counter(r);position:absolute;left:0;top:7px;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:.85rem}

.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.cols3>div{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fbfaf7}
.cols3 h4{font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);margin-bottom:6px}
@media (max-width:700px){.cols3{grid-template-columns:1fr}}

/* acordeão do "Aprender" */
details.lesson{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;box-shadow:var(--shadow)}
details.lesson>summary{list-style:none;padding:14px 18px;cursor:pointer;display:flex;gap:12px;align-items:center;font-weight:600}
details.lesson>summary::-webkit-details-marker{display:none}
details.lesson>summary .n{flex:0 0 30px;height:30px;border-radius:8px;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:.85rem}
details.lesson[open]>summary .n{background:var(--navy);color:#fff}
details.lesson.seen>summary .n{background:var(--ok);color:#fff}
details.lesson>summary .chev{margin-left:auto;transition:transform .2s;color:var(--ink-3)}
details.lesson[open]>summary .chev{transform:rotate(90deg)}
details.lesson .body{padding:0 20px 16px 60px}
@media (max-width:600px){details.lesson .body{padding:0 16px 16px}}

/* formulários */
label.f{display:block;font-weight:600;font-size:.9rem;margin:10px 0 4px}
.inp,textarea.inp,select.inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;transition:border-color .15s, box-shadow .15s}
.inp:focus{outline:none;border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(44,82,130,.15)}
textarea.inp{resize:vertical;min-height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px}
@media (max-width:700px){.grid2,.grid4{grid-template-columns:1fr}}

.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--navy-2)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-2)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--line-2)}
.btn.sm{padding:4px 9px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger:hover{border-color:var(--err);color:var(--err)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* rodapé de navegação */
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);z-index:15;backdrop-filter:blur(6px)}
.foot-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center}
.foot .why{flex:1;font-size:.85rem;color:var(--warn);min-width:0}
.foot .why.ok{color:var(--ok)}
.saved{font-size:.75rem;color:var(--ink-3);font-family:'IBM Plex Mono',monospace}

/* alertas do assistente */
.alerts{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.al{font-size:.84rem;padding:5px 9px;border-radius:6px;display:flex;gap:7px;align-items:flex-start;line-height:1.4}
.al i{font-style:normal;font-weight:700;flex:0 0 auto}
.al.err{background:var(--err-soft);color:var(--err)}
.al.warn{background:var(--warn-soft);color:#7a4d00}
.al.info{background:var(--info-soft);color:var(--info)}
.al.ok{background:var(--ok-soft);color:var(--ok)}

/* coluna 1 */
.stp{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line-2)}
.stp:last-child{border-bottom:0}
.num{width:36px;height:36px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-weight:600}
.tools{display:flex;flex-direction:column;gap:4px}
.tools .btn{padding:3px 8px;font-size:.8rem;justify-content:center}

/* coluna 2/3 */
.sblock{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.shead{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:#fbfaf7;border-bottom:1px solid var(--line)}
.shead .num{flex:0 0 36px}
.shead .txt{font-weight:600;padding-top:6px}
.sbody{padding:12px 14px}
.risk{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:start;margin-bottom:10px}
.inum{font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--accent);font-weight:600;padding-top:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px dashed var(--accent);background:var(--accent-soft);color:#8a3a0c;border-radius:99px;padding:3px 10px;font-size:.8rem}
.chip:hover{background:#f8d9c4}
.pair{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.pair:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.riskro{background:var(--warn-soft);border-radius:6px;padding:7px 10px;font-size:.92rem;margin-bottom:6px}
.riskro b{color:#7a4d00;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;display:block}
.guide{font-size:.82rem;color:var(--ink-2);margin:6px 0 0;padding-left:18px}
.guide li{margin:2px 0}
.norisk{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink-2);margin-top:4px}

/* lateral */
.sidecard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.sidecard h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);margin-bottom:8px}
.sidecard ol,.sidecard ul{padding-left:18px;margin:0;font-size:.88rem}
.sidecard li{margin:4px 0}
.chk{list-style:none;padding:0 !important}
.chk li{display:flex;gap:8px;align-items:flex-start}
.chk li .m{flex:0 0 18px;font-weight:700}
.chk li.y .m{color:var(--ok)}
.chk li.n .m{color:var(--ink-3)}
.meter{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden;margin:4px 0 10px}
.meter>span{display:block;height:100%;background:var(--ok);transition:width .3s}
.meter.mid>span{background:#d49a1a}
.meter.low>span{background:var(--err)}

/* quiz */
.q{border-top:1px solid var(--line-2);padding:14px 0}
.q:first-of-type{border-top:0}
.q .opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.opt{text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px}
.opt:hover{border-color:var(--navy-2)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--err);background:var(--err-soft)}
.fb{margin-top:8px;font-size:.9rem;padding:8px 12px;border-radius:8px}
.fb.right{background:var(--ok-soft);color:#1d5233}
.fb.wrong{background:var(--err-soft);color:#7d1a12}

/* experimentos */
.exps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.exp{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.exp:hover{border-color:var(--navy-2)}
.exp .c{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--accent);font-weight:600}
.exp .t{font-weight:600;font-size:.95rem;line-height:1.3}
.exp .d{font-size:.8rem;color:var(--ink-3)}
.exp.sel{border:2px solid var(--navy);background:var(--navy-soft)}

/* tabela ITr */
.itr{width:100%;border-collapse:collapse;font-size:.88rem;background:#fff}
.itr th,.itr td{border:1.5px solid #333;padding:7px 9px;vertical-align:top}
.itr .hd td{background:#fff;font-variant:normal}
.itr thead th{background:#d8d8d8;font-variant:small-caps;font-size:.92rem}
.itr .hd td{vertical-align:middle}
.itr .hd .ttl{text-align:center}
.itr .hd .ttl b{font-size:1.15rem;letter-spacing:.06em}
.itr .hd .meta{text-align:center;font-size:.8rem;width:23%}
.itr .n{font-weight:700;margin-right:4px}
.table-scroll{overflow-x:auto}

.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.score>div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fbfaf7}
.score .v{font-family:'IBM Plex Mono',monospace;font-size:1.5rem;font-weight:600}
@media (max-width:600px){.score{grid-template-columns:1fr}}
.issues{list-style:none;padding:0;margin:0}
.issues li b{white-space:nowrap}
.issues li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:.88rem;display:flex;gap:8px;align-items:baseline}
.issues li button{margin-left:auto;flex:0 0 auto}
.receipt{border:2px dashed var(--ok);border-radius:12px;padding:18px;background:var(--ok-soft);text-align:center}
.receipt .big{font-family:'IBM Plex Mono',monospace;font-size:1.6rem;font-weight:600;color:var(--ok)}

.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:.9rem;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* impressão: só a ITr */
#printArea{display:none}
@media print{
  body{background:#fff}
  .top,.foot,.wrap,.toast{display:none !important}
  #printArea{display:block}
  .itr{font-size:10.5pt}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="brand-badge">ITr</span>
      <div style="min-width:0">
        <div class="brand-t">Construtor de Instrução de Trabalho</div>
        <div class="brand-s">COTEL · Química Geral Experimental · Programa Análise do Trabalho</div>
      </div>
    </div>
    <div class="code" id="topCode"></div>
  </div>
  <nav class="steps" id="stepper" aria-label="Etapas da atividade"></nav>
</header>

<div class="wrap" id="wrap">
  <main class="main" id="main"></main>
  <aside class="side" id="side"></aside>
</div>

<footer class="foot">
  <div class="foot-in">
    <button class="btn" id="btnPrev">← Voltar</button>
    <div class="why" id="why"></div>
    <span class="saved" id="saved"></span>
    <button class="btn pri" id="btnNext">Avançar →</button>
  </div>
</footer>

<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
/* ================================================================
   CONFIGURAÇÃO — cole aqui a URL do App da Web do Apps Script
   (Implantar > Nova implantação > App da Web > copiar URL /exec)
   ================================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbwNSlm0HhI-wLvFApRYiIl_pa6s0z0hI7KVDRWq4jr-nuvpclsaaqhlqEfQzwPP0LeMsg/exec';
const VERSAO = 'ITr-COTEL 1.0';

/* ---------------- dados: experimentos da apostila ---------------- */
const EXPS = [
 {c:'E1A', t:'Medidas de volume e uso da balança', d:'Exp. 1 – Parte A · exatidão e precisão',
  mat:'Béquer 100 mL; proveta 25 mL; pipeta volumétrica 25,0 mL; pipeta graduada 25 mL; pissete; balança semianalítica (0,001 g); conta-gotas.',
  reag:'Água destilada.',
  proc:['Verificar a capacidade e a precisão da balança; verificar se o prato está limpo; zerar a balança.','Pesar e tarar um béquer de 100 mL.','Medir 25 mL de água em uma proveta, transferir para o béquer, pesar e anotar a massa. Repetir.','Executar o mesmo procedimento com as pipetas de 25,0 mL.','Realizar em triplicata e comparar a exatidão e a precisão das vidrarias.']},
 {c:'E1B', t:'Determinação da densidade de líquidos', d:'Exp. 1 – Parte B · água, álcool, glicerina e óleo',
  mat:'Béquer 100 mL; proveta 10 mL; pissete; balança analítica (0,0001 g); conta-gotas.',
  reag:'Água destilada; álcool etílico; glicerina; óleo vegetal.',
  proc:['Pesar um béquer de 100 mL e tarar.','Medir 5 mL de água destilada em proveta, ajustando o menisco; transferir para o béquer zerado e anotar a massa.','Repetir com álcool, glicerina e óleo vegetal. Anotar e calcular.']},
 {c:'E3A', t:'Separação em funil de decantação', d:'Exp. 3 – Parte A · água + óleo',
  mat:'Proveta; funil de decantação; suporte universal; anel de ferro (garra).',
  reag:'Água destilada; óleo vegetal.',
  proc:['Montar o aparato experimental (Figura 1).','Medir 25 mL de água e de óleo em proveta e transferir para o funil de decantação.','Tampar com rolha e agitar suavemente.','Deixar em repouso até a separação das fases.','Abrir a válvula e permitir o escoamento da fase mais densa.']},
 {c:'E3B', t:'Filtração simples', d:'Exp. 3 – Parte B · filtração por gravidade',
  mat:'Funil de vidro; papel de filtro; béquer; pissete; proveta; bastão de vidro; suporte universal; anel de ferro.',
  reag:'Solução de hidróxido de sódio; solução de alumínio; água destilada.',
  proc:['Adaptar o papel de filtro ao funil, umedecendo-o; colocar o funil no anel preso ao suporte.','Medir 10 mL de cada solução em proveta, misturar em béquer e agitar com bastão.','Transferir a mistura para o funil com auxílio do bastão, sem ultrapassar 2/3 da altura do papel.','Observar o sólido retido e o filtrado.']},
 {c:'E3C', t:'Filtração a vácuo', d:'Exp. 3 – Parte C · funil de Büchner e kitassato',
  mat:'Béquer; bastão de vidro; funil de Büchner; kitassato.',
  reag:'Ácido acetilsalicílico; etanol; água.',
  proc:['Pesar cerca de 1 g de ácido acetilsalicílico em béquer e adicionar 5 mL de etanol; adicionar 20 mL de água destilada.','Montar o aparato (Figura 3) e adaptar o papel de filtro ao Büchner, umedecendo-o.','Filtrar o sólido formado.']},
 {c:'EFA', t:'Temperatura de fusão e ebulição da água', d:'Exp. Fenômenos físicos – Parte A · bico de Bunsen',
  mat:'Béquer 100 mL; termômetro; suporte universal; garra; tela; tripé; bastão de vidro; pissete; bico de Bunsen.',
  reag:'Água; gelo.',
  proc:['Acender o bico de Bunsen e aquecer a tela sobre o tripé por 5 min.','Adicionar gelo até 2/3 do béquer de 100 mL e cerca de 10 mL de água.','Com a temperatura estável, colocar o béquer sobre a tela e fixar o termômetro com suporte e garra.','Disparar o cronômetro e anotar a temperatura a cada 1 minuto até estabilizar.','Relacionar o gráfico temperatura × tempo com as mudanças de estado. Fazer em triplicata.']},
 {c:'EFB', t:'Sublimação do iodo', d:'Exp. Fenômenos físicos – Parte B',
  mat:'Béquer 50 mL seco; vidro de relógio; tela; tripé; bico de Bunsen.',
  reag:'Cristais de iodo.',
  proc:['Colocar 2 cristais de iodo em béquer de 50 mL completamente seco.','Cobrir o béquer com vidro de relógio.','Colocar o béquer sobre a tela aquecida e observar.']},
 {c:'E4A', t:'Miscibilidade entre solventes', d:'Exp. 4 – Parte A · água, etanol, butanol, gasolina, glicerina',
  mat:'Tubos de ensaio; pipetas; béqueres; proveta; pissete; bastão de vidro.',
  reag:'Água; etanol; butanol; gasolina; glicerina.',
  proc:['Preparar as misturas (a) a (i) em tubos de ensaio numerados (5 mL + 2 mL).','Agitar e deixar em repouso.','Observar e anotar. CUIDADO: solventes orgânicos são inflamáveis.']},
 {c:'E4B', t:'Teor de etanol na gasolina', d:'Exp. 4 – Parte B · proveta com tampa',
  mat:'Proveta de 50 mL com tampa.',

const NAO_VERBO = new Set(['por','flor','melhor','pior','maior','menor','valor','calor','vapor','cor','exterior','interior','anterior','posterior','superior','inferior','mar','lugar','par','bar','ar','termômetro','professor','indicador','condutor','motor','recipiente','acessório','titular','sor','colar','pilar','polar','molar','singular','regular','auxiliar','familiar','similar','primeiro','depois','antes','béquer','bequer','becker','erlenmeyer','büchner','buchner','açúcar','acucar','celular','ar-condicionado','éter','eter','cateter','líder','lider','mulher','qualquer','sobre','entre','menor','maior']);
function isInfinitivo(w){
  if(!w) return false;
  w = w.toLowerCase().replace(/[^a-zà-úç\-]/gi,'');
  const base = w.split('-')[0];
  if(['pôr','por-se','pôr-se'].includes(w)) return true;
  if(NAO_VERBO.has(base)) return false;
  if(/(dor|tor|sor)$/.test(base)) return false; // agitador, extintor, exaustor…
  return /(ar|er|ir|or|ôr)$/.test(base) && base.length>=3;
}
const RE_INTENCAO = /\b(cuidado|cuidadoso|cuidadosa|cuidadosamente|aten[çc][ãa]o|atento|atenta|cautela|cauteloso|cautelosa|alerta|com calma|tranquilo|prestar aten[çc][ãa]o|ter cuidado|tomar cuidado|lembre|lembrar de)\b/i;
const RE_RELATORIO = /^(\S+)(ou|eu|iu)-se\b/i;
const RE_MEDIDA = /^(usar|utilizar|vestir|colocar|evitar|manter|fazer|ter|n[ãa]o|sempre|nunca|verificar|conferir|proteger|lavar|separar|pedir|chamar)\b/i;
const RE_GENERICO = /^(acidente|acidentes|risco|riscos|perigo|perigos|les[ãa]o|les[õo]es|perda|perdas|machucar|dano|danos|problema|problemas)\.?$/i;
const RE_EPI_GENERICO = /\b(usar|utilizar)\s+(o |os |os devidos |o devido |)epi'?s?\b(?!\s*(:|como|tipo))/i;
const RE_VER = /^ver\s+(procedimento|potencial|item|etapa)\b/i;

function vStep(t){
  const a=[]; const w=words(t);
  if(!w.length){ a.push({l:'err',m:'Etapa vazia. Escreva a ação ou remova a etapa.'}); return a; }
  const first=w[0];
  if(RE_RELATORIO.test(first)) a.push({l:'warn',m:'“'+first+'” é linguagem de relatório (voz passiva, passado). Na ITr, use o infinitivo: diga o que FAZER (ex.: “Colocar”, “Pesar”).'});
  else if(!isInfinitivo(first)) a.push({l:'warn',m:'Regra 4: inicie com um verbo de ação no infinitivo (ex.: Pesar, Transferir, Verificar, Equipar-se).'});
  if(RE_INTENCAO.test(t)) a.push({l:'warn',m:'“Cuidado/atenção” não é etapa. A 1ª coluna diz só O QUE fazer; os cuidados vão para a 3ª coluna.'});
  if(w.length>28) a.push({l:'warn',m:'Regra 3: excesso de detalhes ('+w.length+' palavras). Deixe aqui só a ação; o “como fazer com segurança” vai para a 3ª coluna.'});
  if(w.length<2) a.push({l:'warn',m:'Muito curta: complete com o objeto da ação (ex.: “Lavar a bureta”).'});
  const verbos = w.filter((x,i)=> i>0 && isInfinitivo(x)).length + (isInfinitivo(first)?1:0);
  if(verbos>=3) a.push({l:'info',m:'Há '+verbos+' ações nesta frase. Talvez sejam etapas diferentes — avalie dividir.'});
  return a;
}
function vRisk(t){
  const a=[]; const w=words(t);
  if(!w.length){ a.push({l:'err',m:'Descreva o potencial de perda ou acidente (ou remova este item).'}); return a; }
  if(RE_VER.test(t)) return a;
  if(RE_MEDIDA.test(t)) a.push({l:'warn',m:'Isto parece uma MEDIDA preventiva. Na 2ª coluna escreva o que pode dar errado (o risco/a perda); a medida vai para a 3ª coluna.'});
  if(RE_INTENCAO.test(t)) a.push({l:'warn',m:'Advertências (“cuidado”, “atenção”) não descrevem um risco. Diga qual lesão ou perda pode ocorrer.'});
  if(RE_GENERICO.test(t.trim()) || w.length<3) a.push({l:'warn',m:'Muito genérico. Seja específico: QUAL lesão/perda, em QUE parte do corpo ou do resultado, POR QUAL causa? Ex.: “Queimadura nos olhos por respingo de ácido”.'});
  return a;
}
function vProc(t){
  const a=[]; const w=words(t);
  if(!w.length){ a.push({l:'err',m:'Escreva o procedimento recomendado para este risco.'}); return a; }
  if(RE_VER.test(t)) return a;
  if(RE_INTENCAO.test(t)) a.push({l:'warn',m:'Manual do PAT: descreva AÇÕES e não intenções. Troque “cuidado/atenção/cautela” por O QUE fazer e COMO fazer.'});
  let f=w[0]; if(/^(n[ãa]o|nunca|sempre)$/i.test(f) && w[1]) f=w[1];
  const f0 = f.replace(/^[a-z]\)\s*/i,'');
  if(!isInfinitivo(f0) && !/^(uso|a\)|b\))/i.test(w[0])) a.push({l:'info',m:'Prefira começar com verbo de ação no infinitivo (ex.: Usar, Adicionar, Posicionar, Conferir).'});
  if(RE_EPI_GENERICO.test(t)) a.push({l:'warn',m:'“Usar EPI” é genérico. Diga QUAL EPI (ex.: luva nitrílica, óculos de ampla visão, jaleco de manga longa).'});
  if(w.length<4) a.push({l:'warn',m:'Curto demais para orientar alguém. Diga o que fazer e como fazer.'});
  return a;
}
const STOP = new Set(['para','pela','pelo','com','sem','que','dos','das','nos','nas','uma','por','como','sobre','entre','após','antes','durante','quando','mais','menos','muito','cada','todo','toda','este','esta','esse','essa','pode','ocorrer','possível','possivel']);
const stems = t => new Set(words((t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ')).filter(w=>w.length>=4 && !STOP.has(w)).map(w=>w.slice(0,5)));
function vCoer(step, risk, proc){
  if(!words(proc).length || RE_VER.test(proc) || RE_VER.test(risk)) return [];
  const a=stems(step+' '+risk), b=stems(proc); for(const x of b) if(a.has(x)) return [];
  return [{l:'info',m:'Recomendação 4: confiram se este procedimento evita exatamente o potencial ao lado — não há nenhuma palavra em comum entre eles.'}];
}
function vJust(t){ return words(t).length<3 ? [{l:'err',m:'Justifique em uma frase por que esta etapa não tem potencial de perda (lembre: quase toda operação tem algum).'}] : []; }

function alertsHTML(a, okMsg){
  if(!a.length) return okMsg ? '<div class="al ok"><i>✓</i><span>'+okMsg+'</span></div>' : '';
  const ic={err:'!',warn:'⚠',info:'i'};
  return a.map(x=>'<div class="al '+x.l+'"><i>'+ic[x.l]+'</i><span>'+esc(x.m)+'</span></div>').join('');
}

/* métricas globais */
function analyze(){
  const r={c1:{n:0,warn:0,err:0}, c2:{n:0,warn:0,err:0}, c3:{n:0,warn:0,err:0}, issues:[], semRisco:0};
  S.steps.forEach((s,i)=>{
    const a1=vStep(s.text); r.c1.n++; tally(r.c1,a1,i,'1ª coluna','Etapa '+(i+1),3);
    if(s.noRisk){ r.semRisco++; const aj=vJust(s.just); r.c2.n++; tally(r.c2,aj,i,'2ª coluna','Etapa '+(i+1)+' (sem potencial)',4); }
    else {
      if(!s.items.length){ r.c2.n++; r.c2.err++; r.issues.push({col:'2ª coluna',where:'Etapa '+(i+1),m:'Sem potencial registrado.',l:'err',scr:4}); }
      s.items.forEach((it,k)=>{
        const n=itemNum(i,s,k);
        r.c2.n++; tally(r.c2,vRisk(it.risk),i,'2ª coluna','Item '+n,4);
        r.c3.n++; tally(r.c3,vProc(it.proc),i,'3ª coluna','Item '+n,5);
      });
    }
  });
  function tally(c,a,i,col,where,scr){
    if(a.some(x=>x.l==='err')) c.err++; else if(a.some(x=>x.l==='warn')) c.warn++;
    a.filter(x=>x.l!=='info').forEach(x=>r.issues.push({col,where,m:x.m,l:x.l,scr}));
  }
  const pct=c=> c.n? Math.round(100*(c.n-c.warn-c.err)/c.n) : 0;
  r.p1=pct(r.c1); r.p2=pct(r.c2); r.p3=pct(r.c3);
  r.indice = Math.round((r.p1+r.p2+r.p3)/3);
  r.nItens = S.steps.reduce((t,s)=>t+(s.noRisk?0:s.items.length),0);
  return r;
}

/* ================================================================
   PORTÕES (o que precisa estar pronto para avançar)
   ================================================================ */
function gate(i){ // retorna mensagem de bloqueio para SAIR da tela i (ou '' se ok)
  switch(i){
    case 0: {
      if(!S.ident.turma.trim()) return 'Informe a turma.';
      if(!S.ident.grupo.trim()) return 'Informe o nome ou número do grupo.';
      if(!S.ident.integrantes.some(p=>p.nome.trim())) return 'Informe pelo menos um integrante.';
      return '';
    }
    case 1: {
      const pend = QUIZ.filter((q,k)=>S.quiz.ans[k]!==q.a).length;
      return pend? 'Acerte as '+QUIZ.length+' questões de verificação ('+pend+' pendente'+(pend>1?'s':'')+').' : '';
    }
    case 2: {
      if(!S.exp.code) return 'Escolha o procedimento do laboratório.';
      if(S.exp.code==='OUT' && words(S.exp.outro).length<3) return 'Descreva o procedimento escolhido.';
      if(words(S.header.titulo).length<3) return 'Escreva o título da ITr (o trabalho a ser executado).';
      return '';
    }
    case 3: {
      const filled=S.steps.filter(s=>words(s.text).length);
      if(filled.length<6) return 'A 1ª coluna precisa de pelo menos 6 etapas ('+filled.length+' até agora).';
      if(filled.length!==S.steps.length) return 'Há etapas vazias: preencha ou remova.';
      return '';
    }
    case 4: {
      for(let k=0;k<S.steps.length;k++){ const s=S.steps[k];
        if(s.noRisk){ if(vJust(s.just).length) return 'Etapa '+(k+1)+': justifique a ausência de potencial.'; }
        else { if(!s.items.length) return 'Etapa '+(k+1)+': registre ao menos um potencial (ou marque “sem potencial”).';
               if(s.items.some(it=>!words(it.risk).length)) return 'Etapa '+(k+1)+': há potencial em branco.'; }
      } return '';
    }
    case 5: {
      for(let k=0;k<S.steps.length;k++){ const s=S.steps[k]; if(s.noRisk) continue;
        const j=s.items.findIndex(it=>!words(it.proc).length); if(j>=0) return 'Item '+itemNum(k,s,j)+': falta o procedimento recomendado.'; }
      return '';
    }
    case 6: {
      if(S.review.checks.some(c=>!c)) return 'Marque as 4 verificações da revisão crítica.';
      if(words(S.review.mudancas).length<8) return 'Descreva o que o grupo mudou na revisão (mín. 8 palavras).';
      return '';
    }
    default: return '';
  }
}
function maxReachable(){ let i=0; while(i<SCREENS.length-1 && !gate(i)) i++; return i; }

/* ================================================================
   RENDERIZAÇÃO
   ================================================================ */
function render(){
  if(S.screen>maxReachable()) S.screen=maxReachable();
  renderChrome();
  const fns=[scrIdent,scrLearn,scrProc,scrCol1,scrCol2,scrCol3,scrReview,scrSend];
  $('#main').innerHTML = fns[S.screen]();
  renderSide();
  window.scrollTo({top:0});
  save();
}
function renderChrome(){
  $('#topCode').textContent = S.codigo + (S.ident.grupo? ' · Grupo '+S.ident.grupo : '');
  const mr=maxReachable();
  $('#stepper').innerHTML = SCREENS.map((n,i)=>
    '<button class="st '+(i===S.screen?'cur':(i<mr||(i<=mr&&i<S.screen)?'done':''))+'" data-act="go" data-to="'+i+'" '+(i>mr?'disabled':'')+'><b>'+String(i+1).padStart(2,'0')+'</b>'+n+'</button>').join('');
  $('#btnPrev').disabled = S.screen===0;
  const g = gate(S.screen);
  const last = S.screen===SCREENS.length-1;
  $('#btnNext').style.display = last?'none':'';
  $('#btnNext').disabled = !!g;
  $('#why').className='why'+(g?'':' ok');
  $('#why').textContent = last? '' : (g || 'Pronto para avançar.');
  $('#wrap').classList.toggle('single', ![2,3,4,5].includes(S.screen));
}

          <div class="alerts" id="al-${s.id}">${words(s.text).length?alertsHTML(vStep(s.text),'Redação adequada.'):''}</div>
        </div>
        <div class="tools">
          <button class="btn" data-act="up" data-id="${s.id}" title="Mover para cima" aria-label="Mover etapa ${i+1} para cima" ${i===0?'disabled':''}>↑</button>
          <button class="btn" data-act="down" data-id="${s.id}" title="Mover para baixo" aria-label="Mover etapa ${i+1} para baixo" ${i===S.steps.length-1?'disabled':''}>↓</button>
          <button class="btn" data-act="ins" data-id="${s.id}" title="Inserir etapa abaixo" aria-label="Inserir etapa abaixo da ${i+1}">+</button>

    <div class="row" style="margin-top:12px"><button class="btn pri" data-act="addStep">+ Adicionar etapa</button><span class="muted">${S.steps.length} etapa(s) · mínimo 6</span></div>
  </div>`;
}

/* ---------- 4: coluna 2 ---------- */
function hintsFor(text, lib){ const out=[]; lib.forEach(h=>{ if(h.re.test(text)) h.h.forEach(x=>{ if(!out.includes(x)) out.push(x); }); }); return out; }
function scrCol2(){
  S.steps.forEach(s=>{ if(!s.noRisk && !s.items.length) s.items.push({id:nid('i'),risk:'',proc:''}); });
  return `

    <div class="kicker">Etapa 5 · 2ª coluna</div>
    <h2>Potencial de perdas e acidentes</h2>

    <p class="muted">As sugestões laranjas são perguntas para o grupo discutir. Clicar nelas apenas abre um novo campo — quem escreve o risco é o grupo.</p>
  </div>
  ${S.steps.map((s,i)=>{
    const hs=hintsFor(s.text,HINTS2);
    return `<div class="sblock" id="blk-${s.id}">
      <div class="shead"><div class="num">${i+1}</div><div class="txt">${esc(s.text)}</div></div>

            <div class="inum">${itemNum(i,s,k)}</div>

            <div class="alerts" id="al-r-${it.id}">${words(it.risk).length?alertsHTML(vRisk(it.risk)):''}</div></div>
            <button class="btn sm danger" data-act="delRisk" data-id="${s.id}" data-item="${it.id}" aria-label="Remover potencial ${itemNum(i,s,k)}">✕</button>

        ${s.noRisk?'':`${hs.length?`<div class="muted" style="font-size:.82rem">Pensem nisto:</div><div class="chips">${hs.map(h=>`<button class="chip" data-act="addRisk" data-id="${s.id}">${esc(h)}</button>`).join('')}</div>`:''}
        <button class="btn sm" data-act="addRisk" data-id="${s.id}">+ potencial</button>`}
        <label class="norisk"><input type="checkbox" data-norisk="${s.id}" ${s.noRisk?'checked':''}> Nesta etapa o grupo não identificou potencial significativo (———)</label>
        ${s.noRisk?`<textarea class="inp" rows="2" data-just="${s.id}" placeholder="Justifique: por que não há perda ou acidente possível nesta etapa?" style="margin-top:6px">${esc(s.just)}</textarea><div class="alerts" id="al-j-${s.id}">${alertsHTML(vJust(s.just))}</div>`:''}
      </div></div>`;}).join('')}`;
}

/* ---------- 5: coluna 3 ---------- */

    ${A.semRisco?`<div class="al info" style="margin-top:8px"><i>i</i><span>${A.semRisco} etapa(s) marcada(s) sem potencial. Lembrem: “não existem operações sem risco”. Confirmem se é isso mesmo.</span></div>`:''}

/* ================================================================
   EVENTOS
   ================================================================ */
function findStep(id){ return S.steps.find(s=>s.id===id); }
function setPath(path,val){ const p=path.split('.'); let o=S; for(let i=0;i<p.length-1;i++) o=o[p[i]]; o[p[p.length-1]]=val; }

document.addEventListener('input', ev=>{
  const t=ev.target; const d=t.dataset;
  if(d.bind){ setPath(d.bind,t.value); }
  else if(d.step){ const s=findStep(d.step); s.text=t.value; const el=$('#al-'+s.id); if(el) el.innerHTML = words(s.text).length?alertsHTML(vStep(s.text),'Redação adequada.'):''; }
  else if(d.risk){ const [sid,iid]=d.risk.split('|'); const it=findStep(sid).items.find(x=>x.id===iid); it.risk=t.value; $('#al-r-'+iid).innerHTML = words(it.risk).length?alertsHTML(vRisk(it.risk)):''; }
  else if(d.proc){ const [sid,iid]=d.proc.split('|'); const st=findStep(sid); const it=st.items.find(x=>x.id===iid); it.proc=t.value; $('#al-p-'+iid).innerHTML = words(it.proc).length?alertsHTML([...vProc(it.proc),...vCoer(st.text,it.risk,it.proc)],'Ação concreta e específica.'):''; }
  else if(d.just){ const s=findStep(d.just); s.just=t.value; $('#al-j-'+s.id).innerHTML=alertsHTML(vJust(s.just)); }
  else if(d.ponto){ findStep(d.ponto).ponto=t.value; }
  else return;
  renderChrome(); if([3,4,5].includes(S.screen)) renderSide(); save();
});
document.addEventListener('change', ev=>{
  const t=ev.target; const d=t.dataset;
  if(d.norisk){ const s=findStep(d.norisk); s.noRisk=t.checked; if(!s.noRisk && !s.items.length) s.items.push({id:nid('i'),risk:'',proc:''}); keepScroll(); }
  else if(d.check!==undefined){ S.review.checks[+d.check]=t.checked; renderChrome(); save(); }
});
document.addEventListener('toggle', ev=>{
  const d=ev.target; if(d.matches && d.matches('details.lesson') && d.open){ S.seen[d.dataset.lesson]=true; save(); }
}, true);
function keepScroll(focusSel){ const y=window.scrollY; renderChrome(); $('#main').innerHTML=[scrIdent,scrLearn,scrProc,scrCol1,scrCol2,scrCol3,scrReview,scrSend][S.screen](); renderSide(); window.scrollTo({top:y}); save(); if(focusSel){ const el=$(focusSel); if(el){ el.focus(); } } }

document.addEventListener('click', ev=>{
  const b=ev.target.closest('[data-act]'); if(!b || b.disabled) return;
  const a=b.dataset.act, id=b.dataset.id;
  const idx = id? S.steps.findIndex(s=>s.id===id) : -1;
  switch(a){
    case 'go': S.screen=+b.dataset.to; render(); break;
    case 'addMember': S.ident.integrantes.push({nome:'',num:''}); keepScroll(); break;
    case 'delMember': S.ident.integrantes.pop(); keepScroll(); break;
    case 'reset': if(confirm('Apagar todo o rascunho deste navegador e recomeçar?')){ try{localStorage.removeItem(LS_KEY);}catch(e){} S=newState(); render(); } break;
    case 'quiz': { const q=+b.dataset.q, o=+b.dataset.o; if(S.quiz.first[q]===undefined) S.quiz.first[q]=(o===QUIZ[q].a); S.quiz.ans[q]=o; keepScroll(); break; }
    case 'pickExp': { S.exp.code=b.dataset.c; keepScroll(); break; }
    case 'addStep': { const s={id:nid('s'),text:'',items:[],noRisk:false,just:'',ponto:''}; S.steps.push(s); keepScroll('[data-step="'+s.id+'"]'); break; }
    case 'ins': { const s={id:nid('s'),text:'',items:[],noRisk:false,just:'',ponto:''}; S.steps.splice(idx+1,0,s); keepScroll('[data-step="'+s.id+'"]'); break; }
    case 'delStep': { const s=S.steps[idx]; const has=s.items.some(it=>it.risk||it.proc); if(!words(s.text).length || !has || confirm('Esta etapa já tem potenciais/procedimentos. Excluir mesmo assim?')){ S.steps.splice(idx,1); keepScroll(); } break; }
    case 'up': if(idx>0){ [S.steps[idx-1],S.steps[idx]]=[S.steps[idx],S.steps[idx-1]]; keepScroll(); } break;
    case 'down': if(idx<S.steps.length-1){ [S.steps[idx+1],S.steps[idx]]=[S.steps[idx],S.steps[idx+1]]; keepScroll(); } break;
    case 'addRisk': { const it={id:nid('i'),risk:'',proc:''}; S.steps[idx].items.push(it); keepScroll('[data-risk="'+id+'|'+it.id+'"]'); if(b.classList.contains('chip')){ const el=$('[data-risk="'+id+'|'+it.id+'"]'); if(el) el.placeholder='Pensando em: '+b.textContent+' → descrevam com as palavras do grupo'; } break; }
    case 'delRisk': { const s=S.steps[idx]; s.items=s.items.filter(x=>x.id!==b.dataset.item); keepScroll(); break; }
    case 'print': doPrint(); break;
    case 'download': doDownload(); break;
    case 'send': doSend(); break;
  }
});
$('#btnPrev').addEventListener('click',()=>{ if(S.screen>0){ S.screen--; render(); } });
$('#btnNext').addEventListener('click',()=>{ if(!gate(S.screen) && S.screen<SCREENS.length-1){ S.screen++; render(); } });

function doPrint(){ $('#printArea').innerHTML=itrTable(); window.print(); }

function payload(){
  const A=analyze();
  const first=Object.values(S.quiz.first).filter(Boolean).length;
  const itens=[];
  S.steps.forEach((s,i)=>{
    if(s.noRisk||!s.items.length) itens.push({etapa:i+1,item:String(i+1),etapa_txt:s.text,potencial:'———',procedimento:s.ponto||'———',sem_risco:true,justificativa:s.just,alertas:[...vStep(s.text),...vJust(s.just)].filter(x=>x.l!=='info').map(x=>x.m).join(' | ')});
    else s.items.forEach((it,k)=>itens.push({etapa:i+1,item:itemNum(i,s,k),etapa_txt:s.text,potencial:it.risk,procedimento:it.proc,sem_risco:false,justificativa:'',alertas:[...(k===0?vStep(s.text):[]),...vRisk(it.risk),...vProc(it.proc)].filter(x=>x.l!=='info').map(x=>x.m).join(' | ')}));
  });
  return {
    versao:VERSAO, codigo:S.codigo, envio:S.envios+1, enviado_em:new Date().toISOString(),
    turma:S.ident.turma, grupo:S.ident.grupo,
    integrantes:S.ident.integrantes.filter(p=>p.nome.trim()).map(p=>p.nome.trim()+(p.num?' ('+p.num+')':'')).join('; '),
    experimento:expLabel(), exp_code:S.exp.code,
    titulo:S.header.titulo, numero:S.header.numero, rev:S.header.rev, data:S.header.data,
    n_etapas:S.steps.length, n_potenciais:A.nItens, etapas_sem_risco:A.semRisco,
    alertas_c1:A.c1.warn+A.c1.err, alertas_c2:A.c2.warn+A.c2.err, alertas_c3:A.c3.warn+A.c3.err,
    ind_c1:A.p1, ind_c2:A.p2, ind_c3:A.p3, indicador:A.indice,
    quiz_primeira:first+'/'+QUIZ.length, aulas_abertas:Object.keys(S.seen).length+'/8',
    tempo_min:Math.round((Date.now()-S.startedAt)/60000),
    revisao_mudancas:S.review.mudancas, revisao_novos:S.review.novos,
    itr_texto:itrTexto(), itens
  };
}
function doDownload(){
  const blob=new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=S.codigo+'_grupo'+(S.ident.grupo||'')+'.json'; document.body.appendChild(a); a.click(); a.remove();
}
async function doSend(){
  const url=apiUrl(); const st=$('#sendStatus'); const btn=$('#btnSend');
  const p=payload(); const body=JSON.stringify(p);
  btn.disabled=true; st.innerHTML='<div class="al info"><i>…</i><span>Enviando…</span></div>';
  const ok=(conf)=>{ S.envios=p.envio; S.lastSend=new Date().toLocaleString('pt-BR')+(conf?' · confirmado pela planilha':' · enviado (sem confirmação de leitura)'); save(); keepScroll(); toast('ITr enviada!'); };
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
    const j=await r.json();
    if(j.ok) ok(true); else throw new Error(j.erro||'erro desconhecido');
  }catch(e1){
    if(e1 instanceof TypeError){ // provável bloqueio de CORS: tenta modo opaco (a planilha ignora duplicatas)
      try{ await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body}); ok(false); return; }
      catch(e2){ st.innerHTML=alertsHTML([{l:'err',m:'Sem conexão com a planilha. Verifiquem a internet e tentem de novo. Se persistir, usem “Salvar PDF” e “Baixar arquivo de dados”.'}]); btn.disabled=false; return; }
    }
    const msg = (e1 instanceof SyntaxError) ? 'A planilha não respondeu como esperado. Avisem o professor (o Apps Script precisa estar implantado com acesso “Qualquer pessoa”). Enquanto isso, usem “Baixar arquivo de dados”.' : 'A planilha recusou o envio: '+e1.message;
    st.innerHTML=alertsHTML([{l:'err',m:msg}]); btn.disabled=false;
  }
}

render();
</script>
